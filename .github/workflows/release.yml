name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.1"
  LANDING_REPO: armonic-tech/landing

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME no apunta a un commit contenido en main"
            exit 1
          fi

  android:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER"
      - run: mv build/app/outputs/flutter-apk/app-release.apk armonic-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: armonic-android.apk

  linux:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release --build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER"
      - run: tar -czf armonic-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: client-linux
          path: armonic-linux-x64.tar.gz

  web:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER"
      - run: cd build/web && zip -qr ../../armonic-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: client-web
          path: armonic-web.zip

  windows:
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --project-name armonic_client .
      - run: flutter pub get
      - shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          flutter build windows --release --build-name="$v" --build-number="$env:GITHUB_RUN_NUMBER"
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath armonic-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: armonic-windows-x64.zip

  release:
    needs: [android, linux, web, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  notify-landing:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.LANDING_DISPATCH_TOKEN }}
        run: |
          gh api "repos/$LANDING_REPO/dispatches" \
            -f event_type=release-published \
            -F "client_payload[product]=client" \
            -F "client_payload[version]=$GITHUB_REF_NAME" \
            -F "client_payload[repo]=$GITHUB_REPOSITORY"
